<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Tapetes</title>
    <!-- Isso aqui puxa o estilo automaticamente direto da internet, sem precisar instalar nada -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <!-- Cabeçalho -->
    <div class="w-full max-w-md pt-4 pb-6 border-b border-gray-800 mb-6 text-center">
        <h1 class="text-2xl font-bold text-blue-400">Medidor de Tapetes</h1>
        <p class="text-sm text-gray-400 mt-2">Centralize o gabarito no chão para tirar a foto</p>
    </div>

    <!-- Tela 1: Botão de Câmera -->
    <div id="tela-camera" class="flex flex-col items-center justify-center flex-1 w-full max-w-md">
        <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 px-8 rounded-2xl shadow-lg cursor-pointer w-full text-center transition-all flex items-center justify-center gap-3">
            <span class="text-xl">📸</span>
            <span class="text-lg">Abrir Câmera</span>
            <!-- Input nativo do HTML para abrir a câmera traseira do celular -->
            <input type="file" accept="image/*" capture="environment" id="inputFoto" class="hidden">
        </label>
    </div>

    <!-- Tela 2: Foto carregada -->
    <div id="tela-foto" class="hidden flex-col items-center w-full max-w-md flex-1">
        <div class="relative w-full bg-black rounded-lg overflow-hidden border-2 border-gray-700 shadow-2xl">
            <img id="imagemCarregada" class="w-full h-auto block" alt="Foto tirada">
            <!-- Canvas invisível onde vamos desenhar depois -->
            <canvas id="camadaDesenho" class="absolute top-0 left-0 w-full h-full"></canvas>
        </div>

        <div class="flex gap-4 mt-8 w-full">
            <button id="btnTirarOutra" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-4 rounded-xl font-semibold transition-colors">
                Tirar Outra
            </button>
            <button id="btnMarcar" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-4 rounded-xl font-bold shadow-lg transition-colors">
                Marcar Gabarito
            </button>
        </div>
    </div>

    <!-- Lógica JavaScript no próprio arquivo para testarmos agora -->
    <script>
        const inputFoto = document.getElementById('inputFoto');
        const telaCamera = document.getElementById('tela-camera');
        const telaFoto = document.getElementById('tela-foto');
        const imagemCarregada = document.getElementById('imagemCarregada');
        const btnTirarOutra = document.getElementById('btnTirarOutra');

        // Quando o usuário escolhe a foto / tira a foto
        inputFoto.addEventListener('change', function(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    imagemCarregada.src = e.target.result; // Mostra a foto na tela
                    telaCamera.classList.add('hidden'); // Esconde o botão da câmera
                    telaCamera.classList.remove('flex');
                    telaFoto.classList.remove('hidden'); // Mostra a tela da foto
                    telaFoto.classList.add('flex');
                }
                leitor.readAsDataURL(arquivo);
            }
        });

        // Quando o usuário quer descartar a foto e tirar outra
        btnTirarOutra.addEventListener('click', function() {
            inputFoto.value = ''; // Limpa a memória
            telaCamera.classList.remove('hidden');
            telaCamera.classList.add('flex');
            telaFoto.classList.add('hidden');
            telaFoto.classList.remove('flex');
        });
    </script>
</body>
</html>
