<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medidor de Tapetes com Folha A4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .pixelated {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col p-4 font-sans select-none">

    <div class="w-full max-w-md mx-auto pt-2 pb-3 border-b border-gray-800 text-center shrink-0">
        <h1 class="text-2xl font-bold text-blue-400">Medidor de Tapetes</h1>
        <p class="text-xs text-gray-400 mt-1 font-medium" id="instrucoes">Coloque uma Folha A4 sobre o piso ao lado do tapete</p>
    </div>

    <!-- Tela 1: Câmera -->
    <div id="tela-camera" class="flex flex-col items-center justify-center flex-1 w-full max-w-md mx-auto mt-10">
        <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 px-8 rounded-2xl shadow-lg cursor-pointer w-full text-center transition-all flex items-center justify-center gap-3">
            <span class="text-2xl">📸</span>
            <span class="text-lg">Tirar / Carregar Foto</span>
            <input type="file" accept="image/*" capture="environment" id="inputFoto" class="hidden">
        </label>
    </div>

    <!-- Tela 2: Edição -->
    <div id="tela-foto" class="hidden flex-col items-center w-full max-w-md mx-auto flex-1">
        
        <!-- Controle de Zoom -->
        <div class="flex items-center gap-3 my-2 w-full bg-gray-800 p-2.5 rounded-xl border border-gray-700 shrink-0">
            <span class="text-lg">🔍</span>
            <input type="range" id="sliderZoom" min="100" max="800" step="10" value="100" class="flex-1 h-2 bg-blue-600 rounded-lg appearance-none cursor-pointer">
            <span id="zoomValor" class="text-xs font-bold w-12 text-right text-blue-400">100%</span>
        </div>

        <!-- Seletor: Mover vs Inserir -->
        <div class="grid grid-cols-2 gap-2 w-full mb-2 shrink-0">
            <button id="btnModoPan" class="py-2.5 px-3 rounded-xl font-bold text-sm bg-blue-600 border border-blue-400 text-white flex items-center justify-center gap-2">
                <span>✋</span> Mover Foto
            </button>
            <button id="btnModoMarcar" class="py-2.5 px-3 rounded-xl font-bold text-sm bg-gray-800 border border-gray-700 text-gray-300 flex items-center justify-center gap-2">
                <span>🎯</span> Inserir Ponto
            </button>
        </div>

        <!-- Viewport da Imagem -->
        <div id="containerScroll" class="w-full h-[50vh] max-h-[440px] bg-black rounded-lg overflow-auto border-2 border-gray-700 shadow-2xl relative mb-3 touch-pan-x touch-pan-y">
            <div id="containerImagem" class="relative w-full origin-top-left">
                <img id="imagemCarregada" class="w-full h-auto block pointer-events-none pixelated" alt="Foto">
                <canvas id="camadaDesenho" class="absolute top-0 left-0 w-full h-full"></canvas>
            </div>
            
            <!-- Lupa Cirúrgica -->
            <div id="lupaCirurgica" class="hidden absolute top-2 right-2 w-28 h-28 rounded-full border-2 border-white shadow-2xl overflow-hidden bg-black z-30 pointer-events-none">
                <canvas id="canvasLupa" width="112" height="112" class="w-full h-full block pixelated"></canvas>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-full h-[1px] bg-red-500 opacity-90 absolute"></div>
                    <div class="h-full w-[1px] bg-red-500 opacity-90 absolute"></div>
                    <div class="w-2.5 h-2.5 rounded-full border border-yellow-300"></div>
                </div>
            </div>
        </div>

        <!-- Resultados -->
        <div id="painelResultado" class="hidden w-full bg-green-950 border border-green-500 rounded-xl p-3 mb-3 text-center shadow-lg">
            <h2 class="text-green-300 font-bold text-xs uppercase tracking-wide">Área com Perspectiva Corrigida (Gabarito A4)</h2>
            <p id="valorArea" class="text-3xl font-black text-white my-1">0.00 m²</p>
            <div id="listaMedidas" class="text-xs text-gray-200 grid grid-cols-2 gap-1.5 mt-2 pt-2 border-t border-green-800 text-left"></div>
        </div>

        <!-- Botões -->
        <div class="flex flex-wrap gap-2 w-full shrink-0 pb-4">
            <button id="btnDesfazer" class="hidden bg-gray-700 active:bg-gray-600 text-white px-4 py-3 rounded-xl font-bold text-sm">
                ↩ Desfazer
            </button>
            <button id="btnAcaoPrincipal" class="flex-1 bg-red-600 active:bg-red-500 text-white py-3 rounded-xl font-bold shadow-lg text-sm">
                1º Marcar Folha A4 (0/4)
            </button>
            <button id="btnCalcular" class="hidden flex-1 bg-green-600 active:bg-green-500 text-white py-3 rounded-xl font-bold shadow-lg text-sm">
                Calcular Medidas
            </button>
            <button id="btnPDF" class="hidden flex-1 bg-red-700 active:bg-red-600 text-white py-3 rounded-xl font-bold shadow-lg text-sm flex items-center justify-center gap-2">
                <span>📄</span> Gerar PDF
            </button>
            <button id="btnReiniciar" class="bg-gray-800 text-gray-300 px-3 py-3 rounded-xl font-semibold text-xs border border-gray-700">
                Limpar
            </button>
        </div>
    </div>

    <script>
        const inputFoto = document.getElementById('inputFoto');
        const telaCamera = document.getElementById('tela-camera');
        const telaFoto = document.getElementById('tela-foto');
        const imagemCarregada = document.getElementById('imagemCarregada');
        
        const sliderZoom = document.getElementById('sliderZoom');
        const zoomValor = document.getElementById('zoomValor');
        const containerImagem = document.getElementById('containerImagem');
        const containerScroll = document.getElementById('containerScroll');
        
        const btnModoPan = document.getElementById('btnModoPan');
        const btnModoMarcar = document.getElementById('btnModoMarcar');
        const btnAcaoPrincipal = document.getElementById('btnAcaoPrincipal');
        const btnCalcular = document.getElementById('btnCalcular');
        const btnDesfazer = document.getElementById('btnDesfazer');
        const btnPDF = document.getElementById('btnPDF');
        const btnReiniciar = document.getElementById('btnReiniciar');

        const lupaCirurgica = document.getElementById('lupaCirurgica');
        const canvasLupa = document.getElementById('canvasLupa');
        const ctxLupa = canvasLupa.getContext('2d');
        const canvas = document.getElementById('camadaDesenho');
        const ctx = canvas.getContext('2d');
        const instrucoes = document.getElementById('instrucoes');
        const painelResultado = document.getElementById('painelResultado');
        const valorArea = document.getElementById('valorArea');
        const listaMedidas = document.getElementById('listaMedidas');

        let estadoEtapa = 'A4'; // 'A4', 'TAPETE', 'FINALIZADO'
        let modoInteracao = 'PAN';
        let pontosA4 = [];      // 4 cantos da Folha A4
        let pontosTapete = [];
        let infoLados = [];
        let pontoArrastando = null;
        let H_matrix = null;

        // DIMENSÕES OFICIAIS FOLHA A4 (ISO 216) EM METROS
        const A4_CURTO_M = 0.210; // 210 mm
        const A4_LONGO_M = 0.297; // 297 mm

        function alternarModoInteracao(novoModo) {
            modoInteracao = novoModo;
            if (novoModo === 'PAN') {
                btnModoPan.className = "py-2.5 px-3 rounded-xl font-bold text-sm bg-blue-600 border border-blue-400 text-white flex items-center justify-center gap-2";
                btnModoMarcar.className = "py-2.5 px-3 rounded-xl font-bold text-sm bg-gray-800 border border-gray-700 text-gray-300 flex items-center justify-center gap-2";
                containerScroll.style.overflow = "auto";
                containerScroll.style.touchAction = "pan-x pan-y";
            } else {
                btnModoMarcar.className = "py-2.5 px-3 rounded-xl font-bold text-sm bg-blue-600 border border-blue-400 text-white flex items-center justify-center gap-2";
                btnModoPan.className = "py-2.5 px-3 rounded-xl font-bold text-sm bg-gray-800 border border-gray-700 text-gray-300 flex items-center justify-center gap-2";
                containerScroll.style.overflow = "hidden";
                containerScroll.style.touchAction = "none";
            }
        }
        btnModoPan.addEventListener('click', () => alternarModoInteracao('PAN'));
        btnModoMarcar.addEventListener('click', () => alternarModoInteracao('MARCAR'));

        function atualizarZoom() {
            const zoom = sliderZoom.value;
            zoomValor.innerText = zoom + '%';
            containerImagem.style.width = zoom + '%';
            requestAnimationFrame(desenharTudo);
        }
        sliderZoom.addEventListener('input', atualizarZoom);

        inputFoto.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (imagemCarregada.src && imagemCarregada.src.startsWith('blob:')) {
                    URL.revokeObjectURL(imagemCarregada.src);
                }
                imagemCarregada.src = URL.createObjectURL(file);
            }
        });

        imagemCarregada.onload = () => {
            telaCamera.classList.replace('flex', 'hidden');
            telaFoto.classList.replace('hidden', 'flex');
            sliderZoom.value = 100;
            atualizarZoom();
            resetar();
            setTimeout(() => {
                canvas.width = imagemCarregada.naturalWidth;
                canvas.height = imagemCarregada.naturalHeight;
                desenharTudo();
            }, 80);
        };

        function obterCoordReal(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function atualizarLupa(pt) {
            if (!pt) return;
            lupaCirurgica.classList.remove('hidden');
            const tam = 112;
            const recorte = 36;
            ctxLupa.clearRect(0, 0, tam, tam);
            ctxLupa.imageSmoothingEnabled = false;
            ctxLupa.drawImage(imagemCarregada, pt.x - recorte/2, pt.y - recorte/2, recorte, recorte, 0, 0, tam, tam);
        }
        function esconderLupa() { lupaCirurgica.classList.add('hidden'); }

        function encontrarPontoProximo(pt, lista, raioMax = 40) {
            const rect = canvas.getBoundingClientRect();
            const escala = canvas.width / rect.width;
            for (let i = 0; i < lista.length; i++) {
                if (Math.hypot(lista[i].x - pt.x, lista[i].y - pt.y) <= (raioMax * escala)) {
                    return i;
                }
            }
            return -1;
        }

        function lidarInicio(clientX, clientY) {
            const pt = obterCoordReal(clientX, clientY);

            // Ajuste fino: arrastar pino já inserido
            let idx = encontrarPontoProximo(pt, pontosA4);
            if (idx !== -1) {
                pontoArrastando = { lista: pontosA4, idx };
                atualizarLupa(pontosA4[idx]);
                return;
            }
            idx = encontrarPontoProximo(pt, pontosTapete);
            if (idx !== -1) {
                pontoArrastando = { lista: pontosTapete, idx };
                atualizarLupa(pontosTapete[idx]);
                return;
            }

            // Inserir ponto novo (somente se estiver no modo MARCAR)
            if (modoInteracao === 'MARCAR') {
                if (estadoEtapa === 'A4' && pontosA4.length < 4) {
                    pontosA4.push(pt);
                    atualizarFluxoA4();
                } else if (estadoEtapa === 'TAPETE') {
                    pontosTapete.push(pt);
                    instrucoes.innerText = `${pontosTapete.length} pontos marcados no tapete.`;
                    if (pontosTapete.length >= 3) btnCalcular.classList.remove('hidden');
                }
                btnDesfazer.classList.remove('hidden');
                desenharTudo();
            }
        }

        function lidarMovimento(clientX, clientY) {
            if (pontoArrastando) {
                const pt = obterCoordReal(clientX, clientY);
                pontoArrastando.lista[pontoArrastando.idx] = pt;
                atualizarLupa(pt);
                desenharTudo();
                if (estadoEtapa === 'FINALIZADO') calcularMedidasComHomografia();
            }
        }

        function lidarFim() {
            pontoArrastando = null;
            esconderLupa();
        }

        canvas.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            lidarInicio(t.clientX, t.clientY);
            if (modoInteracao === 'MARCAR' || pontoArrastando) e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            lidarMovimento(t.clientX, t.clientY);
            if (modoInteracao === 'MARCAR' || pontoArrastando) e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', lidarFim);
        canvas.addEventListener('mousedown', (e) => lidarInicio(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', (e) => lidarMovimento(e.clientX, e.clientY));
        window.addEventListener('mouseup', lidarFim);

        function atualizarFluxoA4() {
            const qtd = pontosA4.length;
            btnAcaoPrincipal.innerText = `1º Marcar Folha A4 (${qtd}/4)`;
            if (qtd === 0) {
                instrucoes.innerText = "Toque nos 4 cantos da Folha A4 em ordem contínua (C1, C2, C3, C4).";
            } else if (qtd < 4) {
                instrucoes.innerText = `Marque o canto C${qtd + 1} da folha A4.`;
            } else {
                instrucoes.innerText = "Folha A4 marcada! Calibre a perspectiva clicando em '2º Marcar Tapete'.";
                btnAcaoPrincipal.className = "flex-1 bg-blue-600 active:bg-blue-500 text-white py-3 rounded-xl font-bold shadow-lg text-sm";
                btnAcaoPrincipal.innerText = "2º Marcar Tapete";
            }
        }

        btnAcaoPrincipal.addEventListener('click', () => {
            if (estadoEtapa === 'A4') {
                if (pontosA4.length !== 4) {
                    alternarModoInteracao('MARCAR');
                    return;
                }
                pontosA4 = ordenarQuatroCantos(pontosA4);
                H_matrix = calcularMatrizHomografiaA4(pontosA4);
                
                estadoEtapa = 'TAPETE';
                btnAcaoPrincipal.classList.add('hidden');
                btnCalcular.classList.remove('hidden');
                instrucoes.innerText = "Marque os cantos do tapete contornando o perímetro.";
                alternarModoInteracao('MARCAR');
                desenharTudo();
            }
        });

        btnDesfazer.addEventListener('click', () => {
            if (estadoEtapa === 'A4' && pontosA4.length > 0) {
                pontosA4.pop();
                atualizarFluxoA4();
            } else if (estadoEtapa === 'TAPETE' && pontosTapete.length > 0) {
                pontosTapete.pop();
            }
            desenharTudo();
        });

        btnCalcular.addEventListener('click', () => {
            if (pontosTapete.length < 3) {
                alert("Marque pelo menos 3 pontos no tapete!");
                return;
            }
            estadoEtapa = 'FINALIZADO';
            calcularMedidasComHomografia();
            alternarModoInteracao('PAN');
            btnCalcular.classList.add('hidden');
            btnPDF.classList.remove('hidden');
            instrucoes.innerText = "Cálculo concluído com retificação A4! Você pode gerar o PDF.";
            desenharTudo();
        });

        // ==========================================
        // GEOMETRIA PROJETIVA / HOMOGRAFIA COM A4
        // ==========================================
        function ordenarQuatroCantos(pts) {
            const cx = pts.reduce((a, b) => a + b.x, 0) / 4;
            const cy = pts.reduce((a, b) => a + b.y, 0) / 4;
            return [...pts].sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
        }

        function calcularMatrizHomografiaA4(srcPts) {
            // Determina se a folha está deitada ou em pé na imagem
            const distHorizontal = Math.hypot(srcPts[1].x - srcPts[0].x, srcPts[1].y - srcPts[0].y);
            const distVertical = Math.hypot(srcPts[3].x - srcPts[0].x, srcPts[3].y - srcPts[0].y);

            let wReal, hReal;
            if (distHorizontal >= distVertical) {
                wReal = A4_LONGO_M; // Paisagem: 297mm largura x 210mm altura
                hReal = A4_CURTO_M;
            } else {
                wReal = A4_CURTO_M; // Retrato: 210mm largura x 297mm altura
                hReal = A4_LONGO_M;
            }

            const dst = [
                { x: 0, y: 0 },
                { x: wReal, y: 0 },
                { x: wReal, y: hReal },
                { x: 0, y: hReal }
            ];

            const A = [];
            for (let i = 0; i < 4; i++) {
                const xs = srcPts[i].x, ys = srcPts[i].y;
                const xd = dst[i].x, yd = dst[i].y;
                A.push([-xs, -ys, -1, 0, 0, 0, xs * xd, ys * xd, xd]);
                A.push([0, 0, 0, -xs, -ys, -1, xs * yd, ys * yd, yd]);
            }

            // Gauss-Jordan
            for (let i = 0; i < 8; i++) {
                let maxRow = i;
                for (let k = i + 1; k < 8; k++) {
                    if (Math.abs(A[k][i]) > Math.abs(A[maxRow][i])) maxRow = k;
                }
                [A[i], A[maxRow]] = [A[maxRow], A[i]];

                for (let k = i + 1; k < 8; k++) {
                    const c = -A[k][i] / A[i][i];
                    for (let j = i; j < 9; j++) {
                        A[k][j] = (i === j) ? 0 : A[k][j] + c * A[i][j];
                    }
                }
            }

            const h = new Array(9);
            h[8] = 1;
            for (let i = 7; i >= 0; i--) {
                let s = -A[i][8];
                for (let j = i + 1; j < 8; j++) s -= A[i][j] * h[j];
                h[i] = s / A[i][i];
            }

            return h;
        }

        function projetarPonto(pt, H) {
            const w = H[6] * pt.x + H[7] * pt.y + H[8];
            return {
                x: (H[0] * pt.x + H[1] * pt.y + H[2]) / w,
                y: (H[3] * pt.x + H[4] * pt.y + H[5]) / w
            };
        }

        function calcularMedidasComHomografia() {
            if (!H_matrix) H_matrix = calcularMatrizHomografiaA4(pontosA4);

            const pontosMetricos = pontosTapete.map(p => projetarPonto(p, H_matrix));

            // Área métrica real retificada
            let areaM2 = 0;
            for (let i = 0; i < pontosMetricos.length; i++) {
                const j = (i + 1) % pontosMetricos.length;
                areaM2 += (pontosMetricos[i].x * pontosMetricos[j].y) - (pontosMetricos[j].x * pontosMetricos[i].y);
            }
            areaM2 = Math.abs(areaM2 / 2);
            valorArea.innerText = areaM2.toFixed(2) + " m²";

            infoLados = [];
            listaMedidas.innerHTML = '';
            for (let i = 0; i < pontosMetricos.length; i++) {
                const j = (i + 1) % pontosMetricos.length;
                const distM = Math.hypot(pontosMetricos[j].x - pontosMetricos[i].x, pontosMetricos[j].y - pontosMetricos[i].y);
                
                infoLados.push({
                    p1: pontosTapete[i],
                    p2: pontosTapete[j],
                    num1: i + 1,
                    num2: j + 1,
                    medida: distM.toFixed(2)
                });

                listaMedidas.innerHTML += `<div><span class="font-bold text-green-400">Pt ${i + 1} ➔ Pt ${j + 1}:</span> ${distM.toFixed(2)}m</div>`;
            }
            painelResultado.classList.remove('hidden');
        }

        // ==========================================
        // RENDERIZAÇÃO
        // ==========================================
        function desenharTudo() {
            if (canvas.width === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const mult = canvas.width / canvas.getBoundingClientRect().width;
            const raio = 4.5 * mult;
            const espessura = 2.5 * mult;
            const fontTam = 13 * mult;

            // 1. Folha A4
            if (pontosA4.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pontosA4[0].x, pontosA4[0].y);
                for (let i = 1; i < pontosA4.length; i++) ctx.lineTo(pontosA4[i].x, pontosA4[i].y);
                if (pontosA4.length === 4) {
                    ctx.lineTo(pontosA4[0].x, pontosA4[0].y);
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
                    ctx.fill();
                }
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = espessura;
                ctx.stroke();

                pontosA4.forEach((p, idx) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, raio, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5 * mult;
                    ctx.stroke();

                    ctx.fillStyle = '#f87171';
                    ctx.font = `bold ${fontTam}px Arial`;
                    ctx.fillText(`C${idx + 1}`, p.x + raio * 1.5, p.y - raio * 1.5);
                });
            }

            // 2. Tapete
            if (pontosTapete.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pontosTapete[0].x, pontosTapete[0].y);
                for (let i = 1; i < pontosTapete.length; i++) ctx.lineTo(pontosTapete[i].x, pontosTapete[i].y);
                if (estadoEtapa === 'FINALIZADO' && pontosTapete.length >= 3) {
                    ctx.lineTo(pontosTapete[0].x, pontosTapete[0].y);
                    ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
                    ctx.fill();
                }
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = espessura;
                ctx.stroke();

                pontosTapete.forEach((p, idx) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, raio, 0, 2 * Math.PI);
                    ctx.fillStyle = '#3b82f6';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5 * mult;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${fontTam}px Arial`;
                    ctx.fillText(idx + 1, p.x + raio * 1.5, p.y - raio * 1.5);
                });
            }

            // 3. Medidas Retificadas
            if (estadoEtapa === 'FINALIZADO') {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                infoLados.forEach(l => {
                    const mx = (l.p1.x + l.p2.x) / 2;
                    const my = (l.p1.y + l.p2.y) / 2;
                    const txt = l.medida + 'm';

                    ctx.font = `bold ${fontTam}px Arial`;
                    const tw = ctx.measureText(txt).width;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.fillRect(mx - tw/2 - 4*mult, my - fontTam*0.7, tw + 8*mult, fontTam * 1.4);
                    ctx.fillStyle = '#4ade80';
                    ctx.fillText(txt, mx, my);
                });
            }
        }

        btnPDF.addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("Medição de Tapete (Gabarito A4)", 105, 20, null, null, "center");

            const maxW = 1600;
            const scale = canvas.width > maxW ? maxW / canvas.width : 1;
            const cTemp = document.createElement('canvas');
            cTemp.width = canvas.width * scale;
            cTemp.height = canvas.height * scale;
            const cx = cTemp.getContext('2d');
            cx.drawImage(imagemCarregada, 0, 0, cTemp.width, cTemp.height);
            cx.drawImage(canvas, 0, 0, cTemp.width, cTemp.height);

            const imgData = cTemp.toDataURL('image/jpeg', 0.85);
            doc.addImage(imgData, 'JPEG', 15, 30, 180, (180 * cTemp.height) / cTemp.width);

            let posY = 30 + ((180 * cTemp.height) / cTemp.width) + 15;
            doc.setFontSize(16);
            doc.setTextColor(22, 163, 74);
            doc.text(`Área Total: ${valorArea.innerText}`, 105, posY, null, null, "center");

            posY += 12;
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.text("Medidas Reais dos Lados:", 20, posY);
            posY += 8;
            doc.setFont("helvetica", "normal");
            infoLados.forEach(l => {
                doc.text(`• Lado ${l.num1} ao ${l.num2}: ${l.medida} metros`, 25, posY);
                posY += 7;
            });

            doc.save('Medicao-Tapete-A4.pdf');
        });

        function resetar() {
            pontosA4 = [];
            pontosTapete = [];
            infoLados = [];
            H_matrix = null;
            estadoEtapa = 'A4';
            alternarModoInteracao('PAN');
            esconderLupa();
            painelResultado.classList.add('hidden');
            btnCalcular.classList.add('hidden');
            btnPDF.classList.add('hidden');
            btnDesfazer.classList.add('hidden');
            btnAcaoPrincipal.classList.remove('hidden');
            btnAcaoPrincipal.className = "flex-1 bg-red-600 active:bg-red-500 text-white py-3 rounded-xl font-bold shadow-lg text-sm";
            btnAcaoPrincipal.innerText = "1º Marcar Folha A4 (0/4)";
            instrucoes.innerText = "Toque nos 4 cantos da Folha A4 em ordem horária.";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        btnReiniciar.addEventListener('click', resetar);
    </script>
</body>
</html>
