<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Tapetes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <!-- Cabeçalho -->
    <div class="w-full max-w-md pt-4 pb-6 border-b border-gray-800 mb-6 text-center">
        <h1 class="text-2xl font-bold text-blue-400">Medidor de Tapetes</h1>
        <p class="text-sm text-gray-400 mt-2 font-medium transition-colors duration-300" id="instrucoes">Centralize o tapete para tirar a foto</p>
    </div>

    <!-- Tela 1: Botão de Câmera -->
    <div id="tela-camera" class="flex flex-col items-center justify-center flex-1 w-full max-w-md">
        <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 px-8 rounded-2xl shadow-lg cursor-pointer w-full text-center transition-all flex items-center justify-center gap-3">
            <span class="text-xl">📸</span>
            <span class="text-lg">Abrir Câmera</span>
            <input type="file" accept="image/*" capture="environment" id="inputFoto" class="hidden">
        </label>
    </div>

    <!-- Tela 2: Foto carregada -->
    <div id="tela-foto" class="hidden flex-col items-center w-full max-w-md flex-1">
        
        <div class="relative w-full bg-black rounded-lg overflow-hidden border-2 border-gray-700 shadow-2xl" id="containerImagem">
            <img id="imagemCarregada" class="w-full h-auto block" alt="Foto tirada">
            <canvas id="camadaDesenho" class="absolute top-0 left-0 w-full h-full touch-none"></canvas>
        </div>

        <div class="flex flex-wrap gap-4 mt-8 w-full">
            <button id="btnTirarOutra" class="flex-1 min-w-[140px] bg-gray-700 hover:bg-gray-600 text-white py-4 rounded-xl font-semibold transition-colors">
                Tirar Outra
            </button>
            <button id="btnMarcar" class="flex-1 min-w-[140px] bg-green-600 hover:bg-green-500 text-white py-4 rounded-xl font-bold shadow-lg transition-colors">
                Marcar Pontos
            </button>
            <button id="btnFinalizar" class="hidden flex-1 min-w-[140px] bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold shadow-lg transition-colors">
                Finalizar Marcação
            </button>
            <button id="btnLimpar" class="hidden flex-1 min-w-[140px] bg-yellow-600 hover:bg-yellow-500 text-white py-4 rounded-xl font-bold shadow-lg transition-colors">
                Limpar Pontos
            </button>
        </div>
    </div>

    <script>
        const inputFoto = document.getElementById('inputFoto');
        const telaCamera = document.getElementById('tela-camera');
        const telaFoto = document.getElementById('tela-foto');
        const imagemCarregada = document.getElementById('imagemCarregada');
        
        // Botões
        const btnTirarOutra = document.getElementById('btnTirarOutra');
        const btnMarcar = document.getElementById('btnMarcar');
        const btnFinalizar = document.getElementById('btnFinalizar');
        const btnLimpar = document.getElementById('btnLimpar');
        
        const canvas = document.getElementById('camadaDesenho');
        const ctx = canvas.getContext('2d');
        const instrucoes = document.getElementById('instrucoes');

        let pontos = [];
        let marcacaoAtiva = false;
        let marcacaoFinalizada = false;

        imagemCarregada.onload = function() {
            canvas.width = imagemCarregada.clientWidth;
            canvas.height = imagemCarregada.clientHeight;
        }

        window.addEventListener('resize', () => {
            if(!telaFoto.classList.contains('hidden')) {
                canvas.width = imagemCarregada.clientWidth;
                canvas.height = imagemCarregada.clientHeight;
                desenharPontos();
            }
        });

        // Quando escolhe/tira a foto
        inputFoto.addEventListener('change', function(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    imagemCarregada.src = e.target.result;
                    telaCamera.classList.add('hidden');
                    telaCamera.classList.remove('flex');
                    telaFoto.classList.remove('hidden');
                    telaFoto.classList.add('flex');
                    resetarMarcacoes();
                }
                leitor.readAsDataURL(arquivo);
            }
        });

        // Botão Tirar Outra
        btnTirarOutra.addEventListener('click', function() {
            inputFoto.value = '';
            telaCamera.classList.remove('hidden');
            telaCamera.classList.add('flex');
            telaFoto.classList.add('hidden');
            telaFoto.classList.remove('flex');
            instrucoes.innerText = "Centralize o tapete para tirar a foto";
        });

        // Botão Iniciar Marcação
        btnMarcar.addEventListener('click', function() {
            marcacaoAtiva = true;
            marcacaoFinalizada = false;
            
            btnMarcar.classList.add('hidden');
            btnTirarOutra.classList.add('hidden');
            
            btnFinalizar.classList.remove('hidden');
            btnLimpar.classList.remove('hidden');
            
            instrucoes.innerText = "Vá tocando nos cantos. Depois clique em Finalizar.";
            instrucoes.classList.add('text-yellow-400');
        });

        // Botão Finalizar Marcação
        btnFinalizar.addEventListener('click', function() {
            if (pontos.length < 3) {
                alert("Marque pelo menos 3 pontos para formar uma área.");
                return;
            }
            
            marcacaoAtiva = false;
            marcacaoFinalizada = true;
            desenharPontos(); 
            
            btnFinalizar.classList.add('hidden');
            btnTirarOutra.classList.remove('hidden'); 
            
            instrucoes.innerText = "Área finalizada! Pronta para cálculo.";
            instrucoes.classList.remove('text-yellow-400');
            instrucoes.classList.add('text-green-400');
        });

        // Botão Limpar
        btnLimpar.addEventListener('click', function() {
            resetarMarcacoes();
            marcacaoAtiva = true;
            btnMarcar.classList.add('hidden');
            btnTirarOutra.classList.add('hidden');
            btnFinalizar.classList.remove('hidden');
            btnLimpar.classList.remove('hidden');
            instrucoes.innerText = "Vá tocando nos cantos. Depois clique em Finalizar.";
            instrucoes.classList.add('text-yellow-400');
        });

        // Lógica de tocar na tela
        canvas.addEventListener('pointerdown', function(event) {
            if (!marcacaoAtiva) return;

            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            pontos.push({ x, y });
            desenharPontos();
        });

        function desenharPontos() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha as linhas
            if (pontos.length > 1) {
                ctx.beginPath();
                ctx.moveTo(pontos[0].x, pontos[0].y);
                for (let i = 1; i < pontos.length; i++) {
                    ctx.lineTo(pontos[i].x, pontos[i].y);
                }
                
                // Se clicou em finalizar, liga o último ponto ao primeiro
                if (marcacaoFinalizada && pontos.length >= 3) {
                    ctx.lineTo(pontos[0].x, pontos[0].y);
                    ctx.fillStyle = 'rgba(59, 130, 246, 0.3)';
                    ctx.fill();
                }
                
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2; // Linha azul um pouquinho mais fina também
                ctx.stroke();
            }

            // Desenha os pontinhos
            pontos.forEach((p, index) => {
                ctx.beginPath();
                // AQUI FOI A MUDANÇA: de 8 para 3 (raio bem menor)
                ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI); 
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1; // Borda branca mais discreta
                ctx.stroke();
                
                // Número do ponto menor e mais perto
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Arial'; // Fonte menor
                ctx.fillText(index + 1, p.x + 6, p.y - 6);
            });
        }

        function resetarMarcacoes() {
            pontos = [];
            marcacaoAtiva = false;
            marcacaoFinalizada = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            btnMarcar.classList.remove('hidden');
            btnTirarOutra.classList.remove('hidden');
            btnFinalizar.classList.add('hidden');
            btnLimpar.classList.add('hidden');
            
            instrucoes.innerText = "Foto tirada! Clique em Marcar Pontos.";
            instrucoes.classList.remove('text-yellow-400', 'text-green-400');
        }
    </script>
</body>
</html>
